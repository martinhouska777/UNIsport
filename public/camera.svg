<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- An iPhone-style camera sticker: a graphite body, a silver top plate with
       the shutter bump, and a glass lens in a steel ring. An asset (like
       trophy.webp) — its colours are the picture, not theme colours. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4f"/>
      <stop offset="1" stop-color="#1f1f22"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/>
      <stop offset="1" stop-color="#c9c9ce"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e9ec"/>
      <stop offset="1" stop-color="#8d8d93"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3b5a7a"/>
      <stop offset="0.55" stop-color="#16202c"/>
      <stop offset="1" stop-color="#050607"/>
    </radialGradient>
  </defs>
  <!-- shutter button + viewfinder bump -->
  <rect x="11" y="12" width="9" height="5" rx="1.5" fill="#2a2a2e"/>
  <path d="M24 17 L27 11 H39 L42 17 Z" fill="#2a2a2e"/>
  <!-- body -->
  <rect x="5" y="16" width="54" height="38" rx="7" fill="url(#body)"/>
  <!-- silver top plate -->
  <path d="M12 16 H52 A7 7 0 0 1 59 23 V25 H5 V23 A7 7 0 0 1 12 16 Z" fill="url(#plate)"/>
  <!-- flash -->
  <rect x="47" y="18.5" width="7" height="4" rx="1" fill="#fff" stroke="#b9b9bf" stroke-width="0.6"/>
  <!-- lens -->
  <circle cx="32" cy="36" r="15" fill="#18181b"/>
  <circle cx="32" cy="36" r="12.5" fill="url(#ring)"/>
  <circle cx="32" cy="36" r="10" fill="#101114"/>
  <circle cx="32" cy="36" r="8.2" fill="url(#glass)"/>
  <circle cx="32" cy="36" r="3.4" fill="#070809"/>
  <circle cx="28.6" cy="32.4" r="2.1" fill="#fff" opacity="0.85"/>
  <circle cx="35.2" cy="39.4" r="0.9" fill="#fff" opacity="0.35"/>
</svg>
