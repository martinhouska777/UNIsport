<title>Winter Points</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#ebf0f6;--surface:#fafcfe;--surface2:#dee3e9;--border:rgba(203,207,213,.55);--frame:#d9dee5;--text:#141618;--faint:#676d76;--primary:#a51c30;--danger:#b91c1c;--success:#166534;
--shadow:0 1px 2px rgba(20,22,24,.05),0 4px 14px rgba(20,22,24,.04);--tint:color-mix(in oklab,var(--primary) 12%,var(--surface));--line:color-mix(in oklab,var(--primary) 45%,transparent);
--wash:color-mix(in oklab,var(--primary) 8%,var(--surface));--off:color-mix(in oklab,var(--faint) 70%,var(--surface));--font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;border-top:4px solid var(--primary)}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap>h1{margin-bottom:24px}
h1{margin:0;font-size:clamp(24px,3.2vw,32px);font-weight:700;letter-spacing:-.02em}
.ver{margin-top:44px}
.ver-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--frame)}
.letter{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:var(--primary);color:#fff;font-weight:700;font-size:15px}
.ver-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.phones{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:28px 20px;align-items:start}
.shot{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.shot figcaption{font-size:14px;font-weight:600}
.phone{width:100%;max-width:360px;height:720px;border:1px solid var(--frame);border-radius:30px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 10px 30px rgba(20,22,24,.09)}
.scr{flex:1;overflow-y:auto;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.hdr{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:13px 14px}
.hdr h3{flex:1;margin:0;font-size:16px;font-weight:500}.ic{display:flex}
.body{padding:16px 14px 28px;display:flex;flex-direction:column;gap:22px}.body.tight{gap:12px}
.gh{margin:0 0 8px;padding:0 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:stretch}
.row .i{width:48px;padding-left:16px;display:flex;align-items:center;flex-shrink:0}
.row .l{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:50px;padding:9px 14px 9px 0}
.row.noi .l{padding-left:16px}
.card>.row+.row .l{border-top:1px solid var(--border)}
.lab{flex:1;min-width:0;font-size:15px}.det{font-size:13px;white-space:nowrap}
.chev{display:flex;color:var(--faint)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.add .i,.add .lab{color:var(--primary)}.add .lab{font-weight:500}
.row.you{background:var(--wash)}.row.you .lab{font-weight:700}
.tn{display:inline-flex;align-items:center;gap:9px;min-width:0}
.num{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.rk{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--surface2);flex-shrink:0;font-variant-numeric:tabular-nums}
.rk.m1{background:#e0a51a;color:#17181c}.rk.m2{background:#98a3b1;color:#17181c}.rk.m3{background:#c07b3e;color:#17181c}
.sw{width:38px;height:22px;border-radius:999px;background:var(--off);position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--primary)}.sw.on::after{left:19px}
.inp{display:inline-block;width:64px;border:1px solid rgba(203,207,213,.9);border-radius:8px;background:var(--surface);padding:6px 9px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;border:1px solid var(--border);background:var(--surface);border-radius:999px;overflow:hidden;flex-shrink:0}
.seg span{flex:1;text-align:center;border-radius:999px;font-weight:600;white-space:nowrap}
.seg.md span{padding:10px 8px;font-size:13px}.seg.sm span{padding:7px 10px;font-size:12px}
.seg span.on{background:var(--text);color:var(--bg)}
.seg.inl{display:inline-flex}.seg.inl span{flex:none;padding:6px 9px}
.foot{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 14px 16px;display:flex;gap:10px}
.foot.two .btn.s{flex:0 0 34%}
.btn{height:48px;border-radius:12px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;flex:1}
.btn.p{background:var(--primary);color:#fff}.btn.s{background:var(--surface);border:1px solid var(--border)}.btn.d{background:var(--surface);border:1px solid var(--border);color:var(--danger)}
.nav{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:flex-end;padding:8px 6px 14px}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500}.ni.on{color:var(--primary);font-weight:600}
.fab{width:50px;height:50px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin:-22px 6px 6px;box-shadow:0 4px 12px rgba(165,28,48,.3)}
/* sheet */
.ov{position:absolute;inset:0;background:rgba(15,15,25,.36);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 14px 18px;box-shadow:0 -10px 30px rgba(15,15,25,.12)}
.grab{width:38px;height:4px;border-radius:4px;background:var(--off);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}.sh-head h3{margin:0;font-size:17px;font-weight:700}
.xbtn{width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}.stack .btn{flex:none}
/* B */
.stripe{box-shadow:inset 4px 0 0 var(--c),var(--shadow)}
.ev{padding:14px 14px 14px 18px}.ev-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ev-name{font-size:18px;font-weight:700;letter-spacing:-.01em}.ev-line{font-size:13px;margin-top:2px}.pen{display:flex}
.sec-head{display:flex;align-items:center;justify-content:space-between}
.addlink{display:inline-flex;align-items:center;gap:3px;color:var(--primary);font-size:13px;font-weight:600;margin:0 4px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ac{padding:10px 10px 10px 14px}.ac-name{font-size:13px;font-weight:600;line-height:1.25}
.big{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.unit{font-size:12px;font-weight:600;margin-left:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chip{font-size:10.5px;font-weight:600;padding:2px 7px;border:1px solid var(--line);color:var(--primary);border-radius:999px;background:var(--surface)}
.tile{padding:10px;text-align:center}.tile .big{font-size:19px}.tl{font-size:11.5px;font-weight:500;line-height:1.25;margin-top:2px}
.tc{padding:10px 10px 10px 14px}.tc-name{font-size:14px;font-weight:600}.tc-cap{font-size:12px;margin-top:2px}
.form{gap:18px}.box{background:var(--surface);border:1px solid rgba(203,207,213,.9);border-radius:12px;padding:12px 14px;font-size:16px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pick{background:var(--surface);border:1px solid rgba(203,207,213,.9);border-radius:14px;padding:13px 6px;text-align:center;font-size:14px;font-weight:600}
.pick.on{background:var(--tint);border-color:var(--primary)}
.lchips{display:flex;flex-wrap:wrap;gap:8px}.lchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid rgba(203,207,213,.9);border-radius:999px;padding:7px 8px 7px 13px;font-size:14px;font-weight:500}
.lx{display:flex;color:var(--faint)}.dash{display:inline-flex;align-items:center;gap:5px;border:1.5px dashed var(--line);color:var(--primary);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600}
.stackc{display:flex;flex-direction:column;gap:10px}
.tb{padding:12px 12px 12px 16px}.tb.mine{background:var(--wash)}
.tb-top{display:flex;align-items:center;gap:9px}.tb-name{flex:1;font-size:15px;font-weight:700}.tb-pts{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.tb-people{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:9px;padding-left:31px}
.pp{display:flex;justify-content:space-between;gap:6px;font-size:12.5px}.pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pv{font-weight:600;font-variant-numeric:tabular-nums}.pp.me{font-weight:700}
/* C */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:11px 6px 9px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:12px}.tbl th:last-child,.tbl td:last-child{padding-right:12px}
.tbl td{padding:7px 6px;border-top:1px solid var(--border);font-size:13.5px;vertical-align:middle}
.tbl .r{text-align:right}.tbl .tn{gap:8px;line-height:1.2}
.cell{display:inline-block;min-width:46px;border:1px solid rgba(203,207,213,.9);border-radius:8px;padding:5px 7px;text-align:right;font-variant-numeric:tabular-nums;background:var(--surface);font-size:14px;min-height:30px}
.sel{display:inline-flex;align-items:center;gap:2px;border:1px solid rgba(203,207,213,.9);border-radius:8px;padding:5px 5px 5px 8px;font-size:13px;background:var(--surface);white-space:nowrap}
.tbl + .row .l{border-top:1px solid var(--border)}
.row.sub .l{padding-left:34px;min-height:44px;border-top:0 !important}.row.sub .lab{font-size:14px}.sw-gap{width:38px;flex-shrink:0}
.st td{padding:9px 5px}.st td.n{font-variant-numeric:tabular-nums;font-size:13px}.st td.b{font-weight:700}.st tr.you td{background:var(--wash)}.st tr.you .tn span:last-child{font-weight:700}
/* D */
.at{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 6px;text-align:center;min-height:84px;border-radius:14px}
.at.on{background:var(--tint);border-color:var(--primary)}.at-name{font-size:12.5px;font-weight:600;line-height:1.2}.at-val{font-size:12px}
.add-tile{border:1.5px dashed var(--line);color:var(--primary);border-radius:14px;display:flex}
.step{display:inline-flex;align-items:center;gap:8px}.sb{width:30px;height:30px;border-radius:50%;border:1px solid rgba(203,207,213,.9);background:var(--surface);display:flex;align-items:center;justify-content:center}
.sv{min-width:46px;text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.vtop{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.crest{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.vname{flex:1;font-size:15px;font-weight:600}.cog{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center}
.wp{padding:13px 14px 13px 18px}.wp-top{display:flex;align-items:center;justify-content:space-between}.wp-title{font-size:16px;font-weight:700}
.wp-team{display:flex;align-items:center;gap:8px;margin-top:10px}.wp-tn{flex:1;font-size:14px;font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.dc{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;border-radius:10px;border:1px solid rgba(203,207,213,.9);background:var(--surface)}
.dl{font-size:11px;font-weight:600}.dv{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-height:17px}
.dc.full{background:var(--primary);border-color:var(--primary);color:#fff}.dc.today{outline:2px solid var(--text);outline-offset:1px}
.dc.empty{border-style:dashed}.hd{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:#fff}
.wp-foot{display:flex;align-items:center;gap:8px;margin-top:12px}.wk{flex:1;font-size:13px;font-weight:600}
.mult{font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--primary);border-radius:999px;padding:2px 8px}.big2{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sess{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 12px 18px}.s-when{font-size:12px;font-weight:600}.s-what{font-size:16px;font-weight:600;margin-top:2px}
.logged{display:inline-flex;align-items:center;gap:4px;color:var(--success);font-size:13px;font-weight:600}
.plusbtn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center}
@media (max-width:420px){.wrap{padding-top:22px}.phone{height:700px}}
</style>
